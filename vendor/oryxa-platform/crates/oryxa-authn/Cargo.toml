[package]
name = "oryxa-authn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
oryxa-core = { version = "0.1.0", path = "../oryxa-core" }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# Pinned: workos 3.5 turns on jsonwebtoken's aws_lc_rs backend beside rust_crypto, and with both on
# jsonwebtoken cannot pick a crypto provider and panics on the first verify (#162). The token tests catch it.
workos = "=3.4.1"

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
rsa = "0.9"
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
