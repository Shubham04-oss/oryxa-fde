[package]
name = "oryxa-events"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-config = { version = "1.8.13", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-eventbridgev2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
oryxa-core = { version = "0.1.0", path = "../oryxa-core" }
pbjson = "0.9"
prost = "0.14"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }

[build-dependencies]
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
proptest.workspace = true
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
