name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Only a PR's older run is cancelled. A push to main runs to the end, so its checks finish and main writes the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in a restored cache and bloat it; debug info off keeps both small.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    # Whether any Rust-relevant file changed. The Rust jobs skip on a job-level `if` (never workflow-level
    # `paths:`), so a required check still reports. main pushes always run everything.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # On a PR HEAD is the merge commit, so HEAD^1..HEAD is exactly the PR's changes. The skip list and the
          # diff live in a script so test-rust-changed.sh can run them without compiling anything.
          rust=true
          if [ "$EVENT" = pull_request ] && out=$(bash .github/scripts/rust-changed.sh); then
            echo "$out"
            case $out in rust=false) rust=false ;; esac
          fi
          # Fails closed: only an explicit rust=false skips; a script error or any other event runs everything.
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: oryxa
          POSTGRES_DB: oryxa_fde
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: test
      - run: cargo test --workspace
      # A service container cannot take the serve-testing argument, so SpiceDB starts as a step.
      - name: Start SpiceDB
        run: |
          name="spicedb-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --rm --name "$name" -p 127.0.0.1::50051 authzed/spicedb:v1.56.2 serve-testing
          echo "SPICEDB_PORT=$(docker port "$name" 50051/tcp | head -1 | cut -d: -f2)" >> "$GITHUB_ENV"
          sleep 3
      - name: Live tests (SpiceDB + Postgres; AWS/WorkOS ones run by the lead)
        env:
          DATABASE_URL: postgres://postgres:oryxa@localhost:${{ job.services.postgres.ports['5432'] }}/oryxa_fde
          SPICEDB_ENDPOINT: http://localhost:${{ env.SPICEDB_PORT }}
        run: cargo test --workspace -- --ignored --skip e2e_ --test-threads=1
      - name: Stop SpiceDB
        if: always()
        run: docker rm -f "spicedb-${{ github.run_id }}-${{ github.run_attempt }}" || true

  # The required status check, kept under its old name. It passes when lint and test passed or were
  # skipped (no Rust changes) and fails if either failed or was cancelled.
  check:
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.lint.result }} ${{ needs.test.result }}
        run: |
          echo "changes lint test: $RESULTS"
          read -r changes lint test <<<"$RESULTS"
          [ "$changes" = success ] && { [ "$lint" = success ] || [ "$lint" = skipped ]; } && { [ "$test" = success ] || [ "$test" = skipped ]; }

  platform-base:
    # The vendored base must still build and pass its own unit tests at the pinned commit.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: platform-base
          workspaces: vendor/oryxa-platform -> target
      - run: cargo test --manifest-path vendor/oryxa-platform/Cargo.toml --workspace

  sandbox:
    # The npm Workers and the agent harness (TypeScript): the sandbox gateway, the harness and the realtime
    # Worker (live run output).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sandbox/gateway, sandbox/harness, realtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A package that has not landed on this branch yet passes as skipped.
      - id: present
        run: echo "yes=$([ -f '${{ matrix.package }}/package.json' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # Lockfile-exact install; prettier and tsc, then the tests.
      - if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.package }}
        run: npm ci --no-audit --no-fund && npm run check && npm test

  schema:
    # The SpiceDB schema must parse and every assertion in its validation file must hold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD/schema:/schema" authzed/zed:v1.2.1 validate /schema/fde.validation.yaml

  # The web app (fde-web/, TanStack Start on Cloudflare Workers). Never deploys.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fde-web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # pnpm from corepack, at the version and sha512 package.json pins (`packageManager`), never a
      # global install. setup-node's pnpm cache asks pnpm where its store is, so pnpm comes first.
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fde-web/pnpm-lock.yaml
      # Lockfile-exact install; only the build scripts pnpm-workspace.yaml allows run.
      - run: pnpm install --frozen-lockfile
      # The generated client must match the API's committed spec (crates/oryxa-fde-api/openapi.json).
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # The dev mock never ships: its marker must not be anywhere in the production build.
      - name: No mock API in the build
        run: |
          if grep -rl "fde-dev-mock-api" dist; then
            echo "::error::The dev mock API is in the production build (files above)."
            exit 1
          fi

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - run: cargo deny check

  infra:
    # OpenTofu checks with no credentials: mock providers only, nothing reaches AWS or Cloudflare.
    runs-on: ubuntu-latest
    env:
      TOFU_URL: https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip
      TOFU_SHA256: 5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8
      ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz
      ACTIONLINT_SHA256: be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenTofu
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tofu.zip" "$TOFU_URL"
          echo "${TOFU_SHA256}  $RUNNER_TEMP/tofu.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tofu.zip" tofu -d "$RUNNER_TEMP/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      # Providers cached per lock file (docs/ci.md); init still checks each one against the lock file's hashes.
      - name: Provider cache directory
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/opentofu/plugins" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/opentofu/plugins"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/opentofu/plugins
          key: opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/envs/*/.terraform.lock.hcl') }}
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/envs/dev init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir=infra/envs/dev validate
      # Plans the environment and each module on mock providers and asserts the security rules.
      - run: tofu -chdir=infra/envs/dev test
      - run: shellcheck infra/scripts/*.sh .github/scripts/*.sh
      # The smoke test against a stub on a loopback port (bash, curl, jq and python3, all on the runner).
      - run: bash infra/scripts/test-smoke-test.sh
      # The Rust-skip filter of the `changes` job, against made-up change lists (no Rust build).
      - run: bash .github/scripts/test-rust-changed.sh
      # The skip list against the Rust sources: a path Rust reads from outside crates/ and vendor/ must run the Rust
      # jobs. The test proves the check catches a skip list that gets one wrong.
      - run: bash .github/scripts/test-rust-reads-check.sh
      - run: bash .github/scripts/rust-reads-check.sh
      # Every workflow, with shellcheck over their run scripts.
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" "$ACTIONLINT_URL"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
