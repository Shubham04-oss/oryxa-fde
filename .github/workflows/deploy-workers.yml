name: deploy-workers
# Deploys the Cloudflare Workers with Wrangler: the sandbox gateway, realtime/ and assistant/ first
# (fde-web binds them, and Cloudflare refuses a service binding to a Worker that does not exist yet),
# then fde-web. Manual, main only, dev only. The Cloudflare API token is a `dev` environment secret
# that only the deploy steps see; installs, checks and builds never get it.
# Setup: infra/README.md, Deploys.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-workers-dev
  cancel-in-progress: false

jobs:
  workers:
    # Only main deploys (the dev environment allows main only, too).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        package: [sandbox/gateway, realtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Worker that has not landed yet (realtime/) is skipped.
      - id: present
        run: echo "yes=$([ -f '${{ matrix.package }}/package.json' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # Lockfile-exact install with no install scripts, and without the Cloudflare token.
      - if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Only this step sees the token. wrangler comes from the package's own devDependencies; the
      # gateway's container image is built here by Docker and pushed to Cloudflare's registry.
      - if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.package }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  assistant:
    # The workspace assistant (ADR 0009). Reached only through fde-web's ASSISTANT service binding.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      # Lockfile-exact install with no install scripts, and without the Cloudflare token.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # prettier, tsc, eslint and the catalogue copy, on the commit being deployed. The tests run in CI's sandbox job.
      - run: npm run check
      # The deploy config is wrangler.jsonc plus dev's API binding (the Workers VPC service fde-web uses), with
      # workers.dev, preview URLs and any route forced off, so fde-web's binding is the only way in. TypeScript
      # (a pinned devDependency) parses the JSONC; jq cannot.
      - name: Add the API binding
        env:
          API_VPC_SERVICE_ID: ${{ vars.API_VPC_SERVICE_ID }}
          # Which model answers: unset keeps wrangler.jsonc's scripted model. `vertex:<model id>` also needs the
          # Worker secrets VERTEX_CLIENT_EMAIL, VERTEX_PRIVATE_KEY, VERTEX_PROJECT and VERTEX_LOCATION, set with
          # `wrangler secret put`; with any of them missing the Worker refuses every turn (it never falls back).
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
        run: |
          : "${API_VPC_SERVICE_ID:?set API_VPC_SERVICE_ID on the dev environment}"
          case "${ASSISTANT_MODEL-}" in
            "" | fake) ;;
            vertex:*) [[ "$ASSISTANT_MODEL" =~ ^vertex:[a-z0-9][a-z0-9.-]{0,62}$ ]] || { echo "ASSISTANT_MODEL is not a model name" >&2; exit 1; } ;;
            *) echo "ASSISTANT_MODEL must be unset, fake or vertex:<model id>" >&2; exit 1 ;;
          esac
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import ts from "typescript";
            const { config, error } = ts.parseConfigFileTextToJson("wrangler.jsonc", readFileSync("wrangler.jsonc", "utf8"));
            if (error || typeof config !== "object" || config === null) throw new Error("wrangler.jsonc does not parse");
            delete config.route;
            delete config.routes;
            config.workers_dev = false;
            config.preview_urls = false;
            config.vpc_services = [{ binding: "API", service_id: process.env.API_VPC_SERVICE_ID }];
            if (process.env.ASSISTANT_MODEL) config.vars = { ...config.vars, ASSISTANT_MODEL: process.env.ASSISTANT_MODEL };
            writeFileSync("wrangler.deploy.json", JSON.stringify(config, null, 2) + "\n");
          '
      # Only this step sees the token. On the first deploy Cloudflare creates the Conversation and PersonTurns
      # Durable Object namespaces from the `exports` block; later deploys keep them and keep the Worker's secrets.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.json

  web:
    # fde-web binds oryxa-fde-realtime and oryxa-fde-assistant, so it deploys only after both succeeded.
    needs: [workers, assistant]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: fde-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node's pnpm cache asks pnpm where its store is, so pnpm comes first, at the version package.json pins.
      - run: npm install -g pnpm@12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fde-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # VITE_ values are baked into the public bundle, so each flag comes from one named dev variable, never a
      # secret and never a pass-through. A flag is on only when its variable is exactly 1.
      - name: Build with the web's flags
        env:
          WEB_OWN_SIGN_IN: ${{ vars.WEB_OWN_SIGN_IN }}
          WEB_WORKSPACE: ${{ vars.WEB_WORKSPACE }}
        run: |
          unset VITE_FDE_OWN_SIGN_IN VITE_FDE_WORKSPACE
          own_sign_in=off
          workspace=off
          if [ "${WEB_OWN_SIGN_IN-}" = "1" ]; then
            export VITE_FDE_OWN_SIGN_IN=1
            own_sign_in=on
          fi
          if [ "${WEB_WORKSPACE-}" = "1" ]; then
            export VITE_FDE_WORKSPACE=1
            workspace=on
          fi
          {
            echo "### Web build flags"
            echo
            echo "| Flag | From | State |"
            echo "| --- | --- | --- |"
            echo "| \`VITE_FDE_OWN_SIGN_IN\` | \`WEB_OWN_SIGN_IN\` | $own_sign_in |"
            echo "| \`VITE_FDE_WORKSPACE\` | \`WEB_WORKSPACE\` | $workspace |"
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm build
      # fde-web's wrangler.jsonc is for local development. The build writes the config Wrangler
      # deploys (dist/server/wrangler.json); dev's route and the private link to the API are added to
      # it here: only <web_hostname> serves the app (no workers.dev or preview URLs), and the API
      # binding is the Workers VPC service (infra/modules/cloudflare).
      - name: Add the dev route and the API binding
        env:
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          API_VPC_SERVICE_ID: ${{ vars.API_VPC_SERVICE_ID }}
        run: |
          : "${WEB_HOSTNAME:?set WEB_HOSTNAME on the dev environment}"
          : "${CLOUDFLARE_ZONE_ID:?set CLOUDFLARE_ZONE_ID on the dev environment}"
          : "${API_VPC_SERVICE_ID:?set API_VPC_SERVICE_ID on the dev environment}"
          config=dist/server/wrangler.json
          jq --arg host "$WEB_HOSTNAME" --arg zone "$CLOUDFLARE_ZONE_ID" --arg api "$API_VPC_SERVICE_ID" '
            .routes = [{pattern: ($host + "/*"), zone_id: $zone}]
            | .workers_dev = false
            | .preview_urls = false
            | .vpc_services = [{binding: "API", service_id: $api}]' "$config" > "$RUNNER_TEMP/wrangler.json"
          mv "$RUNNER_TEMP/wrangler.json" "$config"
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
