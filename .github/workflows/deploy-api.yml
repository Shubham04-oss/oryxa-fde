name: deploy-api
# Builds oryxa-fde-api, oryxa-fde-ops and the two workers (ingest, lifecycle) for linux/arm64 into one image, pushes it to ECR, runs the
# store's migrations as the one-off migrate task (oryxa-fde-ops migrate), then rolls the API and each deployed worker
# onto the new image, in that order. Manual and dev only; AWS access is a
# short-lived OIDC session for the deploy role (infra/envs/dev/deploy.tf). Setup: infra/README.md, Deploys.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-api-dev
  cancel-in-progress: false # never stop a migration or a rollout halfway
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TARGET: aarch64-unknown-linux-gnu

jobs:
  build:
    # A release build: no sccache, no restored cache and a fresh CARGO_HOME (docs/ci.md), so nothing
    # a PR's CI cached can reach a release.
    # Only main deploys; the deploy role trusts this workflow on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The exact toolchain rust-toolchain.toml pins, plus the ARM64 target.
      - run: rustup toolchain install && rustup target add "$TARGET"
      # The runners are x64: cross-compile with the distribution's aarch64 gcc.
      - name: Cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # The service, the one-off operations (migrations) and the workers ship in one image (infra/README.md, The image).
      - name: Build
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo # fresh: every crate comes from the registry for this build
          RUSTC_WRAPPER: "" # no sccache
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p oryxa-fde-api --bin oryxa-fde-api --bin oryxa-fde-ops \
            -p oryxa-fde-context --bin oryxa-fde-ingest \
            -p oryxa-fde-lifecycle --bin oryxa-fde-lifecycle
      # The image's base is Debian 13 (glibc 2.41): refuse a binary that would not start on it.
      - name: Check the glibc the binaries need
        run: |
          for bin in oryxa-fde-api oryxa-fde-ops oryxa-fde-ingest oryxa-fde-lifecycle; do
            need=$(readelf --version-info "target/$TARGET/release/$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$bin needs glibc $need"
            [ "$(printf '%s\n2.41\n' "$need" | sort -V | tail -1)" = "2.41" ]
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oryxa-fde-api
          path: |
            target/${{ env.TARGET }}/release/oryxa-fde-api
            target/${{ env.TARGET }}/release/oryxa-fde-ops
            target/${{ env.TARGET }}/release/oryxa-fde-ingest
            target/${{ env.TARGET }}/release/oryxa-fde-lifecycle
          if-no-files-found: error
          retention-days: 1

  deploy:
    # Light job, always hosted. Only jobs in the `dev` environment can assume the deploy role.
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: infra/docker
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oryxa-fde-api
          path: ${{ runner.temp }}/image
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-api-${{ github.run_id }}
      # Names, subnets and the migrate task's security group, written by OpenTofu (infra/envs/dev/deploy.tf).
      - name: Read the deploy config
        run: |
          CONFIG="$RUNNER_TEMP/deploy.json"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          aws ssm get-parameter --name /oryxa-fde-dev/deploy --query Parameter.Value --output text > "$CONFIG"
          jq -e '.cluster and .service and .api_task_definition and .migrate_task_definition
            and .migrate_security_group and (.subnets | length > 0) and .ecr_repository_url
            and .image_tag_parameter and (.workers | type == "array" and all(.[]; .name and .service and .task_definition))' "$CONFIG" > /dev/null \
            || { echo "::error::the deploy parameter is incomplete or predates the worker deploys: run tofu apply first (infra/README.md, Deploys)"; exit 1; }
      # Tags are immutable: a sha already in ECR is reused, never overwritten.
      - name: Push the image
        run: |
          repo=$(jq -r .ecr_repository_url "$CONFIG")
          echo "IMAGE=$repo:$IMAGE_TAG" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "${repo#*/}" --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2>&1; then
            echo "$repo:$IMAGE_TAG is already in ECR"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker build --platform linux/arm64 -f infra/docker/oryxa-fde-api.Dockerfile -t "$repo:$IMAGE_TAG" "$RUNNER_TEMP/image"
          docker push "$repo:$IMAGE_TAG"
      # New revisions of the migrate, API and worker task definitions: everything as OpenTofu last set it, but the image.
      # All of them are registered before anything changes, so a family that does not fit the rule below stops the
      # deploy before the migrations run. A worker that is not deployed (the lifecycle worker until update_model is set)
      # is not in the config, so it is skipped here, not by catching an error.
      - name: Register task definitions
        run: |
          # Runs inside $(...), where set -e does not reach, so every step returns on failure itself.
          register() {
            local current="$RUNNER_TEMP/$1.current.json" next="$RUNNER_TEMP/$1.json"
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition --output json > "$current" || return 1
            # The API task also carries the tunnel's sidecar: exactly one container runs our image, and only it changes.
            jq -e --arg repo "${IMAGE%:*}" '[.containerDefinitions[] | select(.image | startswith($repo + ":"))] | length == 1' "$current" > /dev/null \
              || { echo "$1 does not have exactly one container running ${IMAGE%:*}" >&2; return 1; }
            jq --arg repo "${IMAGE%:*}" --arg image "$IMAGE" '(.containerDefinitions[] | select(.image | startswith($repo + ":")) | .image) = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy, .deregisteredAt)' "$current" > "$next" || return 1
            aws ecs register-task-definition --cli-input-json "file://$next" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          migrate=$(register "$(jq -r .migrate_task_definition "$CONFIG")")
          api=$(register "$(jq -r .api_task_definition "$CONFIG")")
          # What rolls after the migrations, in order: the API first, then each worker (see the roll step for why).
          ROLLS="$RUNNER_TEMP/rolls.json"
          jq -n --arg service "$(jq -r .service "$CONFIG")" --arg td "$api" '[{name: "api", service: $service, task_definition: $td}]' > "$ROLLS"
          mapfile -t workers < <(jq -c '.workers[]' "$CONFIG")
          for worker in "${workers[@]}"; do
            td=$(register "$(jq -r .task_definition <<< "$worker")")
            jq --argjson w "$worker" --arg td "$td" '. + [{name: $w.name, service: $w.service, task_definition: $td}]' "$ROLLS" > "$ROLLS.next"
            mv "$ROLLS.next" "$ROLLS"
          done
          { echo "ROLLS=$ROLLS"; echo "MIGRATE_TASK_DEFINITION=$migrate"; } >> "$GITHUB_ENV"
      - name: Run migrations
        run: |
          cluster=$(jq -r .cluster "$CONFIG")
          network=$(jq -c '{awsvpcConfiguration: {subnets: .subnets, securityGroups: [.migrate_security_group],
            assignPublicIp: "DISABLED"}}' "$CONFIG")
          task=$(aws ecs run-task --cluster "$cluster" --launch-type FARGATE --task-definition "$MIGRATE_TASK_DEFINITION" \
            --network-configuration "$network" --started-by "deploy-api-$GITHUB_RUN_ID" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::the migrate task did not start"
            exit 1
          fi
          echo "migrate task: $task"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          read -r code reason < <(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" \
            --query 'tasks[0].[containers[0].exitCode, stoppedReason]' --output text)
          [ "$code" = "0" ] || { echo "::error::migrations failed (exit $code: $reason); logs: CloudWatch /ecs/$(jq -r .migrate_task_definition "$CONFIG")"; exit 1; }
      # The API first, then each worker, one at a time: the API makes the events and the workers read them, and an event
      # may gain a field but never lose one (infra/README.md, Deploys), so a worker that is still the old image reads
      # what the new API writes. Each wait is bounded (the AWS CLI waiter polls every 15 s for at most 40 tries, 10 minutes)
      # and a service that does not settle fails the deploy; the services already rolled stay on the new image.
      - name: Roll the API and the workers onto the new image
        run: |
          cluster=$(jq -r .cluster "$CONFIG")
          mapfile -t pending < <(jq -c '.[]' "$ROLLS")
          for roll in "${pending[@]}"; do
            name=$(jq -r .name <<< "$roll") service=$(jq -r .service <<< "$roll") td=$(jq -r .task_definition <<< "$roll")
            echo "rolling $name ($service) onto $td"
            aws ecs update-service --cluster "$cluster" --service "$service" --task-definition "$td" > /dev/null
            aws ecs wait services-stable --cluster "$cluster" --services "$service"
            # The circuit breaker rolls a failed deployment back, which also reads as stable: check ours stuck.
            aws ecs describe-services --cluster "$cluster" --services "$service" --output json \
              | jq -e --arg td "$td" \
                  '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition == $td and .rolloutState == "COMPLETED"' \
              > /dev/null || { echo "::error::$name ($service) did not settle on $td"; exit 1; }
          done
      # OpenTofu reads this on every plan, so a later apply keeps this image instead of rolling back. Only after the API and
      # every worker settled on it: after a deploy that stopped partway an apply returns everything to the last complete one.
      - name: Record the deployed image
        run: |
          aws ssm put-parameter --name "$(jq -r .image_tag_parameter "$CONFIG")" --type String --value "$IMAGE_TAG" --overwrite > /dev/null
          {
            echo "### Deployed oryxa-fde-api to dev"
            echo "- image: \`$IMAGE\`"
            echo "- migrate: \`$MIGRATE_TASK_DEFINITION\`"
            jq -r '.[] | "- \(.name): `\(.task_definition)`"' "$ROLLS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of ECR
        if: always()
        run: docker logout "$(jq -r '.ecr_repository_url | split("/")[0]' "$CONFIG" 2> /dev/null)" > /dev/null 2>&1 || true
