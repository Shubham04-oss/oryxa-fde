name: rust-cache
description: >-
  Cargo registry and compiled dependency cache for Rust jobs on GitHub-hosted runners. One cache entry
  per job (shared-key); only main saves it, pull requests restore main's.
inputs:
  shared-key:
    description: Cache key for this job. Give each job its own, so a job has exactly one entry.
    required: true
  workspaces:
    description: Cargo workspaces to cache, as rust-cache takes them
    default: ". -> target"
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        cache-targets: "true"
        # PRs only restore: a PR run never writes, so the 10 GB repo limit holds main's entries, not PR churn.
        save-if: ${{ github.ref == 'refs/heads/main' }}
