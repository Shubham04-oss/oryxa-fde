name: rust-cache
description: >-
  Compile cache for Rust jobs on both runner kinds. sccache stores compiled crates in the GitHub
  Actions cache on hosted runners and on local disk on the oryxa-a1 runners; rust-cache keeps the
  cargo registry on hosted runners (a1 keeps CARGO_HOME between runs).
inputs:
  workspaces:
    description: Cargo workspaces to cache, as rust-cache takes them
    default: ". -> target"
runs:
  using: composite
  steps:
    # A cancelled build on a persistent runner leaves target/ corrupt; sccache makes the rebuild cheap.
    - name: Clear stale build output
      if: runner.environment == 'self-hosted'
      shell: bash
      run: rm -rf target vendor/oryxa-platform/target
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: Point sccache at the right store
      shell: bash
      run: |
        if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        else
          # One store and one server port per runner instance: a runner runs one job at a time, and
          # two runners on a1 must not share an sccache server that either job's cleanup can kill.
          # ponytail: the port comes from a hash of the runner name; set SCCACHE_SERVER_PORT in the
          # runner's .env if two names ever collide.
          echo "SCCACHE_DIR=${SCCACHE_DIR:-$HOME/.cache/sccache/$RUNNER_NAME}" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE:-20G}" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_PORT=${SCCACHE_SERVER_PORT:-$((4300 + $(printf %s "$RUNNER_NAME" | cksum | cut -d' ' -f1) % 500))}" >> "$GITHUB_ENV"
        fi
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: runner.environment == 'github-hosted'
      with:
        workspaces: ${{ inputs.workspaces }}
        # sccache already caches compiled crates; keep the Actions cache for the registry.
        cache-targets: "false"
