# Run: zed validate schema/fde.validation.yaml
schemaFile: "./fde.zed"
relationships: |-
  workspace:t1|ws#admin@user:t1|alice
  workspace:t1|ws#member@user:t1|bob
  workspace:t2|ws#admin@user:t2|alice
assertions:
  assertTrue:
    # An admin manages the workspace and reaches it.
    - workspace:t1|ws#manage@user:t1|alice
    - workspace:t1|ws#access@user:t1|alice
    # A member reaches it.
    - workspace:t1|ws#access@user:t1|bob
  assertFalse:
    # A member does not manage it.
    - workspace:t1|ws#manage@user:t1|bob
    # Someone with neither role (a customer's guest) gets nothing.
    - workspace:t1|ws#access@user:t1|gina
    # Another tenant's users get nothing, even with the same names and roles.
    - workspace:t1|ws#manage@user:t2|alice
    - workspace:t1|ws#access@user:t2|alice
    - workspace:t2|ws#access@user:t1|alice
