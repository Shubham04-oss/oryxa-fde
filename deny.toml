# Supply-chain gate: run `cargo deny check` in CI.
[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities and unmaintained crates (RustSec).
yanked = "deny"
ignore = [
    # rsa "Marvin" timing attack affects RSA private-key operations. We only verify WorkOS RS256
    # signatures (public key); rsa comes in via workos' pinned jsonwebtoken. Revisit if that changes.
    { id = "RUSTSEC-2023-0071", reason = "public-key RS256 verification only; not exploitable here" },
]

[licenses]
# Permissive only. Copyleft and source-available licences (AGPL, GPL, ELv2, BSL, SSPL) are refused.
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL", "MPL-2.0",
    "BlueOak-1.0.0", # permissive (OSI); aws-smithy-cbor
]
confidence-threshold = 0.9
# Our own crates are unpublished (publish = false).
private = { ignore = true }

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
