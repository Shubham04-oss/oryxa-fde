# Supply-chain gate: run `cargo deny check` in CI.
[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities and unmaintained crates (RustSec).
yanked = "deny"
ignore = [
    # rsa "Marvin" timing attack affects RSA private-key operations. We only verify WorkOS RS256
    # signatures (public key); rsa comes in via workos' pinned jsonwebtoken. Revisit if that changes.
    { id = "RUSTSEC-2023-0071", reason = "public-key RS256 verification only; not exploitable here" },
    # crypto-bigint 0.5 has no fix (0.7.6 does). It comes in only through elliptic-curve 0.13 via the vendored
    # oryxa-authn's jsonwebtoken 10.3.0 (RS256 public-key verification only; ECDSA refused) and oryxa-events'
    # aws-config credentials-login (the `aws login` developer flow, unused on ECS). Same decision as the platform.
    # Revisit when jsonwebtoken and aws-config move to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via elliptic-curve 0.13; public-key verification only; no 0.5 fix" },
    # pin-utils 0.1.1 is unmaintained (archived upstream, no fixed release); this is not a vulnerability. It comes in
    # through aws-smithy-http 0.62/0.63 (aws-config and the AWS SDK clients). Current AWS SDKs drop it but need
    # rust-version 1.94.1. Remove this once the SDK upgrade lands (#77).
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained via aws-smithy-http; no vulnerability; dropped by the AWS SDK upgrade" },
]

[licenses]
# Permissive only. Copyleft and source-available licences (AGPL, GPL, ELv2, BSL, SSPL) are refused.
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL", "MPL-2.0",
    "BlueOak-1.0.0", # permissive (OSI); aws-smithy-cbor
]
confidence-threshold = 0.9
# Our own crates are unpublished (publish = false).
private = { ignore = true }

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
