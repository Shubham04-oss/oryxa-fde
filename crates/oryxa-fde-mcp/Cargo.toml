[package]
name = "oryxa-fde-mcp"
version = "0.1.0"
description = "Read-only MCP server for coding agents: one project's context, scope, decisions and tasks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oryxa-fde-mcp"
path = "src/bin/mcp.rs"

[dependencies]
axum.workspace = true
oryxa-authn.workspace = true
oryxa-authz.workspace = true
oryxa-fde-api.workspace = true
oryxa-fde-context.workspace = true
oryxa-fde-core.workspace = true
oryxa-fde-store.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
workos.workspace = true
