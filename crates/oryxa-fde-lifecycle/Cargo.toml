[package]
name = "oryxa-fde-lifecycle"
version = "0.1.0"
description = "The lifecycle engine: rules on FDE events, the project activity feed, and drafted weekly updates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oryxa-fde-lifecycle"
path = "src/bin/lifecycle.rs"

[dependencies]
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-sdk-sqs.workspace = true
oryxa-core.workspace = true
oryxa-events.workspace = true
oryxa-fde-core.workspace = true
oryxa-fde-events = { workspace = true, features = ["sqs"] }
oryxa-fde-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
oryxa-fde-store = { workspace = true, features = ["testing"] }
rand = "0.8"
sqlx.workspace = true
