[package]
name = "oryxa-fde-store"
version = "0.1.0"
description = "FDE tables, migrations, row-level security, the outbox and its relay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-config.workspace = true
aws-credential-types = "1"
aws-sigv4 = "1"
http = "1"
sha2.workspace = true
oryxa-core.workspace = true
oryxa-events.workspace = true
oryxa-fde-core.workspace = true
oryxa-fde-events.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# Live-test helpers (an owner pool and a store on a fresh runtime login); never in a release build.
testing = []

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
