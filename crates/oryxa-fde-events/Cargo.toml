[package]
name = "oryxa-fde-events"
version = "0.1.0"
description = "FDE event payloads on the oryxa-events bus contract"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-sqs = { workspace = true, optional = true }
oryxa-core.workspace = true
oryxa-events.workspace = true
oryxa-fde-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# The SQS consumer loop (`inbox::sqs`), for the workers that read the bus.
sqs = ["dep:aws-sdk-sqs", "dep:tokio", "dep:tracing"]

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
