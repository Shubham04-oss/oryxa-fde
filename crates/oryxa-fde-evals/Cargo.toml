[package]
name = "oryxa-fde-evals"
version = "0.1.0"
description = "Eval suites, graders and the runner that executes them in the company's sandbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# RFC 4180 CSV for case and result imports (Unlicense OR MIT).
csv = "1.3"
oryxa-core.workspace = true
oryxa-fde-core.workspace = true
oryxa-fde-events.workspace = true
oryxa-fde-store.workspace = true
# Already in the tree (tracing-subscriber, sqlx): the regex grader, with size limits.
regex = "1.11"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
oryxa-fde-store = { workspace = true, features = ["testing"] }
tokio.workspace = true
